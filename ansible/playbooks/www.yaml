---
# Deploy a Docker Compose service to hosts with the "docker" role.
#
# For each targeted host this playbook expects:
#   templates/<hostname>-docker-compose.yaml   (required, Jinja2)
#   templates/<hostname>/*.env.j2              (optional, Jinja2 – skipped if absent)
#
# Usage:
#   ansible-playbook playbooks/docker-compose.yaml
#   ansible-playbook playbooks/docker-compose.yaml --limit myhost
#   ansible-playbook playbooks/docker-compose.yaml -e service_name=myapp
#
# Variables:
#   service_name        Name of the service directory under compose_base_dir.
#                       Defaults to inventory_hostname.
#   compose_base_dir    Parent directory for all services. Default: /home/ansible
#
- name: Deploy Docker Compose service
  hosts: "{{ target_hosts | default('wwws') }}"
  gather_facts: yes
  become: yes

  vars:
    service_name: "{{ inventory_hostname }}"
    compose_base_dir: /home/ansible
    compose_deploy_dir: "{{ compose_base_dir }}/{{ service_name }}"
    _compose_template_j2: "{{ playbook_dir }}/../templates/{{ service_name }}/docker-compose.yaml.j2"
    _compose_template_plain: "{{ playbook_dir }}/../files/{{ service_name }}/docker-compose.yaml"
    _env_template_dir: "{{ playbook_dir }}/../templates/www"
    _env_template_glob: "{{ _env_template_dir }}/*.env.j2"
    _laptop_bootstrap_archive_host_path: "{{ compose_deploy_dir }}/data/laptop.tar.gz"

  tasks:
    - name: Ensure gitea.priv.moyer.wtf is present in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "192.168.20.2 gitea.priv.moyer.wtf"
        state: present
        insertbefore: BOF

    # -------------------------------------------------------------------------
    # Pre-flight checks (run on controller, not on the remote host)
    # -------------------------------------------------------------------------
    - name: Check whether Jinja2 compose template exists on controller
      ansible.builtin.stat:
        path: "{{ _compose_template_j2 }}"
      delegate_to: localhost
      become: false
      register: _compose_template_j2_stat

    - name: Check whether plain compose file exists on controller
      ansible.builtin.stat:
        path: "{{ _compose_template_plain }}"
      delegate_to: localhost
      become: false
      register: _compose_template_plain_stat

    - name: Fail when no compose template found for host
      ansible.builtin.fail:
        msg: >-
          No compose template found for host '{{ inventory_hostname }}'.
          Checked: {{ _compose_template_j2 }} and {{ _compose_template_plain }}
      when: not _compose_template_j2_stat.stat.exists and not _compose_template_plain_stat.stat.exists

    - name: Set compose template path
      ansible.builtin.set_fact:
        _compose_template: >-
          {{ _compose_template_j2 if _compose_template_j2_stat.stat.exists else _compose_template_plain }}

    - name: Check whether env template directory exists on controller
      ansible.builtin.stat:
        path: "{{ _env_template_dir }}"
      delegate_to: localhost
      become: false
      register: _env_template_dir_stat

    - name: Discover env templates on controller
      ansible.builtin.set_fact:
        _env_templates: "{{ query('fileglob', _env_template_glob) | sort }}"
      when: _env_template_dir_stat.stat.exists and _env_template_dir_stat.stat.isdir

    # -------------------------------------------------------------------------
    # Directory layout
    # -------------------------------------------------------------------------
    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}"
        state: directory
        owner: ansible
        group: ansible
        mode: "0750"

    - name: Ensure env directory exists
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}/env"
        state: directory
        owner: ansible
        group: ansible
        mode: "0750"
      when: _env_template_dir_stat.stat.exists and _env_template_dir_stat.stat.isdir

    - name: Ensure archive publish directory exists
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}/data"
        state: directory
        owner: ansible
        group: ansible
        mode: "0755"

    - name: Ensure laptop archive placeholder file exists
      ansible.builtin.file:
        path: "{{ _laptop_bootstrap_archive_host_path }}"
        state: touch
        owner: ansible
        group: ansible
        mode: "0644"

    # -------------------------------------------------------------------------
    # Deploy compose file and optional env files
    # -------------------------------------------------------------------------
    - name: Deploy docker-compose.yaml
      ansible.builtin.template:
        src: "{{ _compose_template }}"
        dest: "{{ compose_deploy_dir }}/docker-compose.yaml"
        owner: ansible
        group: ansible
        mode: "0640"
      register: _compose_file

    - name: Deploy env files
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ compose_deploy_dir }}/env/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: ansible
        group: ansible
        mode: "0600"
      loop: "{{ _env_templates | default([]) }}"
      when: _env_template_dir_stat.stat.exists and _env_template_dir_stat.stat.isdir
      register: _env_files

    # -------------------------------------------------------------------------
    # Pull images and (re)start services
    # -------------------------------------------------------------------------

    - name: Log in to Gitea Container Registry
      community.docker.docker_login:
        registry_url: "https://gitea.priv.moyer.wtf"
        username: "ansible"
        password: "{{ ansible_gitea_pat }}"
        reauthorize: yes

    - name: Pull Docker images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ compose_deploy_dir }}"
      register: _compose_pull
      changed_when: "'Pulled' in _compose_pull.stdout"

    - name: Start services (docker compose up -d)
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ compose_deploy_dir }}"
      register: _compose_up
      changed_when: >-
        'Started' in _compose_up.stdout or
        'Created' in _compose_up.stdout or
        'Recreated' in _compose_up.stdout

    # -------------------------------------------------------------------------
    # Setup webhook listener for www configuration updates
    # -------------------------------------------------------------------------

- name: Deploy www webhook listener pieces
  hosts: www
  become: true
  vars:
    laptop_bootstrap_webhook_packages:
      - curl
      - webhook
  tasks:
    - name: Install prerequisite packages
      ansible.builtin.package:
        name: "{{ laptop_bootstrap_webhook_packages }}"
        state: present
      when: laptop_bootstrap_webhook_enabled

    - name: Create deploy group
      ansible.builtin.group:
        name: "{{ laptop_bootstrap_deploy_group }}"
        system: true
      when: laptop_bootstrap_webhook_enabled

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ laptop_bootstrap_deploy_user }}"
        group: "{{ laptop_bootstrap_deploy_group }}"
        system: true
        home: "{{ laptop_bootstrap_webhook_workdir }}"
        shell: /usr/sbin/nologin
        create_home: false
        groups:
          - docker
          - ansible
        append: true
      when: laptop_bootstrap_webhook_enabled

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(laptop_bootstrap_deploy_user) }}"
        group: "{{ item.group | default(laptop_bootstrap_deploy_group) }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ laptop_bootstrap_webhook_workdir }}", mode: "0755" }
        - { path: "{{ laptop_bootstrap_live_config_path }}", mode: "0755" }
        - { path: "/etc/webhook", owner: "{{ laptop_bootstrap_deploy_user }}", group: "{{ laptop_bootstrap_deploy_group }}", mode: "0755" }
      when: laptop_bootstrap_webhook_enabled

    - name: Install deploy script
      ansible.builtin.template:
        src: ../templates/www/deploy-laptop-bootstrap.sh.j2
        dest: "{{ laptop_bootstrap_webhook_script_path }}"
        owner: "{{ laptop_bootstrap_deploy_user }}"
        group: "{{ laptop_bootstrap_deploy_group }}"
        mode: "0755"
      when: laptop_bootstrap_webhook_enabled

    - name: Install webhook hook definition
      ansible.builtin.template:
        src: ../templates/www/hooks.json.j2
        dest: "{{ laptop_bootstrap_webhook_hooks_file }}"
        owner: "{{ laptop_bootstrap_deploy_user }}"
        group: "{{ laptop_bootstrap_deploy_group }}"
        mode: "0640"
      notify: Restart webhook
      when: laptop_bootstrap_webhook_enabled

    - name: Install webhook systemd unit
      ansible.builtin.template:
        src: ../templates/www/webhook.service.j2
        dest: /etc/systemd/system/webhook.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart webhook
      when: laptop_bootstrap_webhook_enabled

    - name: Enable and start webhook service
      ansible.builtin.systemd:
        name: webhook.service
        enabled: true
        state: started
      when: laptop_bootstrap_webhook_enabled

    - name: Run the initial deploy script to populate live config
      ansible.builtin.command:
        cmd: "{{ laptop_bootstrap_webhook_script_path }}"
      become: true
      become_user: "{{ laptop_bootstrap_deploy_user }}"
      when: laptop_bootstrap_webhook_enabled

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart webhook
      ansible.builtin.systemd:
        name: webhook.service
        state: restarted