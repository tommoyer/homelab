---
# Global variables for all hosts
ansible_python_interpreter: /usr/bin/python3

# Network defaults
dns_servers:
  - 192.168.100.2

# Service defaults
service_restart_policy: unless-stopped

# Shared email settings used by multiple services
email_host: "smtp-relay.mgmt.moyer.wtf"
email_port: "25"
email_username: ""
email_password: ""
email_use_tls: false
email_use_ssl: false
email_timeout: ""
email_host_user: ""
email_host_password: ""
email_ssl_certfile: ""
email_ssl_keyfile: ""

# -----------------------------------------------------------------------------
# Kanidm client (Debian hosts)
# -----------------------------------------------------------------------------

kanidm_uri: "https://kanidm.moyer.wtf"
kanidm_hostname: "kanidm.mgmt.moyer.wtf"

kanidm_login_groups:
  - "linux_users"
  - "linux_admins"

kanidm_admin_group: "linux_admins"

kanidm_uid_attr_map: "name"
kanidm_gid_attr_map: "name"

kanidm_home_prefix: "/home/"
kanidm_home_attr: "uuid"
kanidm_home_alias: "name"
kanidm_use_etc_skel: true
kanidm_default_shell: "/bin/bash"

kanidm_ca_src: "kanidm-ca.crt"
kanidm_ca_dest: "/usr/local/share/ca-certificates/kanidm-ca.crt"

kanidm_ppa_key_url: "https://kanidm.github.io/kanidm_ppa/kanidm_ppa.asc"
kanidm_ppa_list_url: "https://kanidm.github.io/kanidm_ppa/kanidm_ppa.list"

kanidm_service_account_enabled: false
kanidm_service_account_token: ""
kanidm_service_account_token_path: "/etc/kanidm/unixd_token"

kanidm_ldap_base_dn: "dc=kanidm,dc=moyer,dc=wtf"
kanidm_ldap_uri: "ldaps://kanidm.mgmt.moyer.wtf:636"

# --- homelab_node role feature flags ---
homelab_node_bootstrap_enabled: false  # Enable per-host only when bootstrapping new nodes
homelab_node_apt_cacher_ng_enabled: true
homelab_node_hardening_enabled: true
homelab_node_kanidm_enabled: true
homelab_node_node_exporter_enabled: true
homelab_node_tailscale_enabled: true
homelab_node_tailscale_up_skip: false

homelab_node_tailscale_extra_hosts:
  - "192.168.30.12 gitea-ssh.priv.moyer.wtf"
  - "192.168.20.2 gitea.priv.moyer.wtf"